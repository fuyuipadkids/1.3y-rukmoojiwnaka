<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uT, uYaw, uPitch, uN, uSweep;
uniform vec3 uKey;
uniform sampler2D uTex;
uniform sampler2D uFrame;
uniform vec3 uFI;
uniform float uTailY;
uniform float uCy;
uniform sampler2D uSdf;

float dot2(vec2 v){ return dot(v, v); }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
float smin(float a, float b, float k){ float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }

float sdHeart(vec2 p){
  p.x = abs(p.x);
  if (p.y + p.x > 1.0) return sqrt(dot2(p - vec2(0.25, 0.75))) - 0.35355;
  return sqrt(min(dot2(p - vec2(0.0, 1.0)), dot2(p - 0.5 * max(p.x + p.y, 0.0)))) * sign(p.x - p.y);
}
float sH(vec2 p, float S){ return sdHeart(p / S + vec2(0.0, 0.55)) * S; }
float sdMoon(vec2 p, float d, float ra, float rb){
  p.y = abs(p.y);
  float a = (ra * ra - rb * rb + d * d) / (2.0 * d);
  float b = sqrt(max(ra * ra - a * a, 0.0));
  if (d * (p.x * b - p.y * a) > d * d * max(b - p.y, 0.0)) return length(p - vec2(a, b));
  return max(length(p) - ra, -(length(p - vec2(d, 0.0)) - rb));
}
float sdOct(vec3 p, vec3 s){ p = abs(p) / s; return (p.x + p.y + p.z - 1.0) * min(s.x, min(s.y, s.z)) * 0.57735; }
float slab(float d2, float z, float th){
  vec2 w = vec2(d2, abs(z) - th);
  return min(max(w.x, w.y), 0.0) + length(max(w, 0.0));
}
float horn(vec2 p, float z, vec2 c, float ang, float s){
  vec2 l = rot(-ang) * (p - c) / s;
  float dm = sdMoon(l, 0.45, 1.0, 0.95) * s;
  float th = 0.05 * s * clamp(-dm / (0.06 * s) + 0.35, 0.2, 1.0);
  return length(vec2(max(dm, 0.0), max(abs(z) - th, 0.0))) + min(max(dm, abs(z) - th), 0.0) - 0.022;
}

const float SO = 2.35;
vec3 toObj(vec3 p){ vec3 q = p; q.xz = rot(-uYaw) * q.xz; q.yz = rot(-uPitch) * q.yz; return q; }
vec3 fromObj(vec3 v){ v.yz = rot(uPitch) * v.yz; v.xz = rot(uYaw) * v.xz; return v; }

float capsule(vec3 p, vec3 a, vec3 b, float r){
  vec3 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - r * (1.0 - 0.45 * h);
}
float sdArc(vec2 p, vec2 sc, float ra){
  p.x = abs(p.x);
  return (sc.y * p.x > sc.x * p.y) ? length(p - sc * ra) : abs(length(p) - ra);
}
const float SS = 1.75;

vec2 map(vec3 p){
  vec3 q = toObj(p);
  vec2 xy = q.xy;
  vec2 m = vec2(abs(xy.x), xy.y);
  vec2 eb = vec2(q.x, q.y - 0.1);
  float boxd = length(max(abs(eb) - vec2(0.95), 0.0));
  float gem;
  if (boxd > 0.0) {
    gem = max(boxd, abs(q.z) - 0.12) + 0.02;
  } else {
    vec2 tuv = vec2((q.z >= 0.0 ? q.x : -q.x) / 1.9 + 0.5, 0.5 - eb.y / 1.9);
    float hg = texture2D(uTex, tuv).r;
    float H = 0.12 * smoothstep(0.32, 0.95, hg);
    gem = (abs(q.z) - H + (1.0 - smoothstep(0.0, 0.35, hg)) * 0.04) * 0.32;
  }

  float o = sH(xy, SO);
  float plate = 9.0;
  float c = 9.0;
  {
    float ia = atan(abs(xy.x), xy.y - 0.1);
    float fz = fract(ia * 12.0 / 3.14159);
    float tri = 1.0 - abs(fz * 2.0 - 1.0);
    float spk = pow(tri, 5.0);
    float u = -(o + 0.36);
    float w = 0.03 + 0.17 * spk;
    float d2r = max(-u, u - w) * 0.7;
    float thk = min(0.11, max(-d2r, 0.0) * 1.7) + 0.003;
    vec2 wr = vec2(d2r, abs(q.z) - thk);
    c = (min(max(wr.x, wr.y), 0.0) + length(max(wr, 0.0))) * 0.6;
  }
  float fd = 9.0;
  if (uFI.z > 0.0) {
    vec2 fu = vec2(uFI.x - abs(q.x) * uFI.z, uFI.y - q.y * uFI.z);
    vec2 cl = clamp(fu, 0.002, 0.998);
    float sx = texture2D(uSdf, cl).r * 2.0 - 1.0;
    float d2 = sign(sx) * sx * sx * 1.5 + length(fu - cl) / uFI.z;
    float thk = min(0.15, max(-d2, 0.0) * 1.7) + 0.003;
    vec2 w2 = vec2(d2, abs(q.z) - thk);
    fd = (min(max(w2.x, w2.y), 0.0) + length(max(w2, 0.0))) * 0.45;
  }
  vec2 r = vec2(c, 2.0);
  if (fd < r.x) r = vec2(fd, 5.0);
  if (gem < r.x) r = vec2(gem, 1.0);
  if (plate < r.x) r = vec2(plate, 4.0);
  {
    vec3 pq = q - vec3(0.0, uTailY, 0.0);
    float sw = 0.14 * sin(uT * 1.1);
    pq.xy = rot(sw) * pq.xy;
    float bail = length(vec2(length(pq.xy - vec2(0.0, -0.05)) - 0.045, pq.z)) - 0.012;
    float chain = 9.0;
    for (int i = 0; i < 3; i++) {
      vec3 lp = pq - vec3(0.0, -0.12 - float(i) * 0.06, 0.0);
      if (i == 1) lp.xz = lp.zx;
      chain = min(chain, length(vec2(length(vec2(lp.x, lp.y * 0.7)) - 0.026, lp.z)) - 0.008);
    }
    float metal = min(bail, chain);
    vec3 gp = pq - vec3(0.0, -0.44, 0.0);
    float frame2 = length(vec2(sH(gp.xy, 0.26) - 0.02, gp.z)) - 0.022;
    metal = min(metal, frame2);
    metal = min(metal, sdOct(gp - vec3(0.0, -0.36, 0.0), vec3(0.035, 0.2, 0.025)));
    metal = min(metal, sdOct(gp - vec3(0.0, -0.22, 0.0), vec3(0.11, 0.022, 0.025)));
    metal = min(metal, sdOct(vec3(abs(gp.x) - 0.2, gp.y - 0.12, gp.z), vec3(0.1, 0.02, 0.02)));
    if (metal < r.x) r = vec2(metal, 2.0);
    float g2 = sH(gp.xy, 0.24);
    float gem = slab(g2, gp.z, 0.06 * sqrt(clamp(-g2 / 0.1, 0.0, 1.0)) + 0.008) * 0.6;
    if (gem < r.x) r = vec2(gem, 6.0);
  }
  return r;
}

vec3 normalAt(vec3 p){
  vec2 e = vec2(0.001, -0.001);
  return normalize(e.xyy * map(p + e.xyy).x + e.yyx * map(p + e.yyx).x +
                   e.yxy * map(p + e.yxy).x + e.xxx * map(p + e.xxx).x);
}
float aoAt(vec3 p, vec3 n){
  float o = 0.0, s = 1.0;
  for (int i = 1; i <= 3; i++) {
    float h = 0.03 + 0.09 * float(i);
    o += (h - map(p + n * h).x) * s;
    s *= 0.7;
  }
  return clamp(1.0 - 2.2 * o, 0.0, 1.0);
}

float light(vec3 r, vec3 d, float s){ return smoothstep(cos(s), cos(s * 0.85), dot(r, normalize(d))); }
vec3 env(vec3 r){
  vec3 c = vec3(0.01, 0.01, 0.015) + vec3(0.16, 0.17, 0.22) * smoothstep(-0.3, 1.0, r.y);
  c += vec3(0.28, 0.3, 0.38) * light(r, vec3(0.0, 0.35, 1.0), 1.15);
  c += vec3(0.95, 0.97, 1.05) * 2.4 * light(r, uKey, 0.3);
  vec3 sf = vec3(sin(uSweep), 0.0, cos(uSweep));
  c += vec3(0.9, 0.95, 1.0) * 2.2 * exp(-pow(dot(r, vec3(cos(uSweep), 0.0, -sin(uSweep))) * 16.0, 2.0)) * smoothstep(-0.1, 0.3, dot(r, sf)) * smoothstep(-0.7, 0.2, r.y);
  c += vec3(1.0) * 1.3 * exp(-pow((r.y - 0.42) * 38.0, 2.0)) * smoothstep(-0.2, 0.4, r.z);
  c += vec3(0.9, 0.95, 1.0) * 0.8 * exp(-pow((r.x - 0.35) * 30.0, 2.0)) * smoothstep(0.0, 0.6, r.y);
  c += vec3(0.9, 0.95, 1.0) * 0.7 * exp(-pow((r.x + 0.45) * 30.0, 2.0)) * smoothstep(-0.2, 0.5, r.y);
  c += vec3(0.25, 0.42, 1.0) * 1.8 * light(r, vec3(0.92, 0.25, 0.35), 0.22);
  c += vec3(0.25, 0.5, 1.0) * 2.0 * light(r, vec3(-0.92, 0.15, 0.4), 0.22);
  c += vec3(0.95, 0.97, 1.0) * 0.8 * light(r, vec3(0.0, 0.1, 1.0), 0.14);
  c += vec3(0.8, 0.9, 1.0) * exp(-pow(r.y * 10.0, 2.0)) * 0.7;
  c += vec3(0.3, 0.3, 0.4) * 0.45 * smoothstep(0.0, -1.0, r.y);
  return c;
}
float mapLite(vec3 p){
  vec3 q = toObj(p);
  return 9.0;
}
vec3 bounce(vec3 p, vec3 n, vec3 rf){
  float t = 0.03;
  for (int i = 0; i < 22; i++) {
    vec3 q = p + n * 0.01 + rf * t;
    float d = mapLite(q);
    if (d < 0.004) {
      vec2 e = vec2(0.004, -0.004);
      vec3 n2 = normalize(e.xyy * mapLite(q + e.xyy) + e.yyx * mapLite(q + e.yyx) + e.yxy * mapLite(q + e.yxy) + e.xxx * mapLite(q + e.xxx));
      return env(reflect(rf, n2)) * vec3(0.72, 0.78, 0.95) * 0.8;
    }
    t += max(d, 0.02);
    if (t > 2.5) break;
  }
  return env(rf);
}
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}
float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 3; i++) { v += a * vnoise(p); p = p * 2.03 + 1.7; a *= 0.5; } return v; }
float sdHeartSoft(vec2 p){
  p.x = sqrt(p.x * p.x + 0.02);
  float a = length(p - vec2(0.25, 0.75)) - 0.35355;
  float m = 0.5 * max(p.x + p.y, 0.0);
  float b = sqrt(min(dot2(p - vec2(0.0, 1.0)), dot2(p - vec2(m)))) * sign(p.x - p.y);
  float k = 0.12;
  float hsel = clamp(0.5 + 0.5 * (p.y + p.x - 1.0) / k, 0.0, 1.0);
  return mix(b, a, hsel);
}
float liquid(vec2 p){
  vec2 w = p + 0.36 * vec2(fbm(p * 1.2 + uT * 0.05), fbm(p * 1.2 + vec2(5.2, 1.3) - uT * 0.04)) - 0.18;
  float hd = sdHeartSoft(w * 1.3 + vec2(0.0, 0.55));
  return 0.5 + 0.5 * sin(hd * 10.0 - uT * 0.55 + fbm(w * 1.8) * 2.4);
}
vec3 backdrop(vec2 uv){
  float h0 = liquid(uv);
  float e = 0.0025;
  vec2 g = vec2(liquid(uv + vec2(e, 0.0)) - h0, liquid(uv + vec2(0.0, e)) - h0) / e;
  vec3 n = normalize(vec3(-g * 0.1, 1.0));
  vec3 rd = normalize(vec3(uv * 0.6, -1.0));
  vec3 rf = reflect(rd, n);
  float ndv = clamp(dot(n, -rd), 0.0, 1.0);
  float band = smoothstep(0.2, 0.8, h0);
  float sub = fbm(uv * 3.0 + h0 * 2.0);
  vec3 cobalt = mix(vec3(0.02, 0.06, 0.24), vec3(0.07, 0.17, 0.5), sub);
  vec3 pearl = mix(vec3(0.34, 0.38, 0.48), vec3(0.52, 0.56, 0.66), sub);
  vec3 base = mix(cobalt, pearl, band);
  float ridge = exp(-pow((h0 - 0.5) * 7.0, 2.0)) + exp(-pow((h0 - 0.08) * 14.0, 2.0)) * 0.6;
  vec3 refl = env(rf);
  float glint = pow(max(dot(rf, normalize(uKey + vec3(0.0, 0.0, 0.8))), 0.0), 220.0) * 5.0
              + pow(max(dot(rf, normalize(vec3(-0.5, 0.6, 0.8))), 0.0), 140.0) * 2.0;
  vec3 col = base * (0.45 + 0.55 * n.z) + refl * mix(vec3(0.12, 0.2, 0.5), vec3(0.4), band) * 0.5;
  col = mix(col, refl * vec3(0.9, 0.92, 0.96) * 0.9 + vec3(0.3, 0.32, 0.36), clamp(ridge, 0.0, 1.0) * 0.85);
  col += vec3(1.0) * glint * (0.2 + ridge * 0.5);
  col *= 0.3;
  return col;
}
float lumA(vec4 c){ return dot(c.rgb, vec3(0.3, 0.5, 0.2)) * c.a; }
vec3 worn(vec3 col, vec3 q, float ndv, float amt){
  float g = fbm(q.xy * 7.0 + vec2(q.z * 4.0, 3.1));
  float g2 = 0.0;
  float dirt = clamp(smoothstep(0.42, 0.72, g) * 0.75 + smoothstep(0.5, 0.78, g2) * 0.07, 0.0, 1.0);
  col *= 1.0 - 0.38 * dirt * amt;
  col = mix(col, vec3(dot(col, vec3(0.3, 0.55, 0.15))) * vec3(0.92, 0.95, 1.05), 0.55 * amt);
  col += vec3(0.15, 0.38, 1.0) * pow(1.0 - ndv, 5.0) * 0.45;
  return col;
}
vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uN;
  uv.y += uCy;
  vec3 ro = vec3(0.0, 0.0, 5.2);
  vec3 rd = normalize(vec3(uv, -1.9));

  vec3 col = vec3(0.0);

  float t = 2.6, mD = 9.0;
  vec3 nGeo = vec3(0.0, 0.0, 1.0);
  vec2 h = vec2(9.0, 0.0);
  bool hit = false;
  float bb = dot(ro, rd), disc = bb * bb - (dot(ro, ro) - 4.1 * 4.1);
  float t1 = 0.0;
  if (disc > 0.0) {
    t = max(-bb - sqrt(disc), 0.0);
    t1 = -bb + sqrt(disc);
    for (int i = 0; i < 150; i++) {
      vec3 p = ro + rd * t;
      h = map(p);
      mD = min(mD, h.x);
      if (h.x < 0.0005 * t) { hit = true; break; }
      t += h.x * (h.y == 1.0 ? 0.6 : 0.85);
      if (t > t1) break;
    }
    if (!hit && h.x < 0.004 && t < t1) hit = true;
  }

  if (hit) {
    vec3 p = ro + rd * t;
    vec3 n = normalAt(p);
    nGeo = n;
    vec3 q = toObj(p);
    float relief = 0.0, inEm = 0.0;
    if (h.y == 1.0) {
      relief = smoothstep(-0.75, 0.95, q.y);
    }

    float ndv = clamp(dot(n, -rd), 0.0, 1.0);
    vec3 rf = reflect(rd, n);
    float ao = aoAt(p, n);
    float glint = pow(max(dot(rf, normalize(uKey)), 0.0), 220.0) * 9.0
                + pow(max(dot(rf, normalize(vec3(0.92, 0.25, 0.35))), 0.0), 180.0) * 4.5
                + pow(max(dot(rf, normalize(vec3(-0.92, 0.15, 0.4))), 0.0), 180.0) * 4.5
                + pow(max(dot(rf, normalize(vec3(0.0, 0.1, 1.0))), 0.0), 260.0) * 5.0;
    float pulse = 0.85 + 0.15 * sin(uT * 1.6);

    if (h.y == 1.0 || h.y == 2.0) {
      vec3 F0 = vec3(0.9, 0.91, 0.96);
      if (h.y == 1.0) {
        F0 = relief < 0.5 ? mix(vec3(0.22, 0.42, 0.95), vec3(0.93, 0.94, 0.97), relief * 2.0)
                          : mix(vec3(0.93, 0.94, 0.97), vec3(0.8, 0.84, 0.92), (relief - 0.5) * 2.0);
      }
      vec3 F = F0 + (1.0 - F0) * pow(1.0 - ndv, 5.0);
      vec3 ir = 0.5 + 0.5 * cos(6.2831 * (vec3(0.0, 0.33, 0.67) + pow(1.0 - ndv, 2.0) * 1.4 + 0.55));
      F *= mix(vec3(1.0), vec3(0.45, 0.6, 1.0), pow(1.0 - ndv, 2.0) * 0.45);
      col = bounce(p, n, rf) * F * (0.3 + 0.7 * ao) + vec3(1.0) * glint * ao * 0.3;
      col = worn(col, q, ndv, h.y == 1.0 ? 0.3 : 0.45) * (h.y == 1.0 ? 1.1 : 1.05);

    } else if (h.y == 5.0) {
      vec2 fu = vec2(uFI.x - abs(q.x) * uFI.z, uFI.y - q.y * uFI.z);
      vec4 fc = texture2D(uFrame, fu);
      vec3 nO = toObj(n);
      float face = smoothstep(0.6, 0.95, abs(nO.z));
      float e = 4.0 / 1080.0;
      float lx = lumA(texture2D(uFrame, fu + vec2(e, 0.0))) - lumA(texture2D(uFrame, fu - vec2(e, 0.0)));
      float ly = lumA(texture2D(uFrame, fu - vec2(0.0, e))) - lumA(texture2D(uFrame, fu + vec2(0.0, e)));
      n = normalize(n + fromObj(vec3(-lx, -ly, 0.0)) * 0.9 * face);
      ndv = clamp(dot(n, -rd), 0.0, 1.0);
      rf = reflect(rd, n);
      float gl5 = pow(max(dot(rf, normalize(uKey)), 0.0), 220.0) * 9.0
                + pow(max(dot(rf, normalize(vec3(0.92, 0.25, 0.35))), 0.0), 180.0) * 4.5
                + pow(max(dot(rf, normalize(vec3(-0.92, 0.15, 0.4))), 0.0), 180.0) * 4.5
                + pow(max(dot(rf, normalize(vec3(0.0, 0.1, 1.0))), 0.0), 260.0) * 5.0;
      vec3 tint = clamp(fc.rgb * 1.15, 0.0, 1.0);
      float rl = smoothstep(-2.0, 1.6, q.y);
      vec3 F0 = rl < 0.5 ? mix(vec3(0.3, 0.48, 0.95), vec3(0.93, 0.94, 0.97), rl * 2.0)
                         : mix(vec3(0.93, 0.94, 0.97), vec3(0.85, 0.88, 0.94), (rl - 0.5) * 2.0);
      vec3 F = F0 + (1.0 - F0) * pow(1.0 - ndv, 5.0);
      vec3 ir = 0.5 + 0.5 * cos(6.2831 * (vec3(0.0, 0.33, 0.67) + pow(1.0 - ndv, 2.0) * 1.4 + 0.55));
      F *= mix(vec3(1.0), vec3(0.45, 0.6, 1.0), pow(1.0 - ndv, 2.0) * 0.45);
      vec3 chromeCol = worn(bounce(p, n, rf) * F * (0.3 + 0.7 * ao) + vec3(1.0) * gl5 * ao * 0.25, q, ndv, 0.7) * 1.4;
      float L = dot(fc.rgb, vec3(0.3, 0.5, 0.2));

  function layout() {
    const topY = eyc - (125 - HY) / sImg, botY = eyc - (978 - HY) / sImg - 0.62;
    cyOff = K0 * (topY + botY) / 2;
    const spanPx = (topY - botY) * sImg;
    const fit = Math.min(W * 1.0, H * 0.9 * IMG / spanPx);
    fScale = fit / IMG;
    Ncss = fScale * sImg / K0;
    pivX = HX * fScale; pivY = (HY + eyc * sImg) * fScale;
  }
  const GLINTS = [];
  for (const [gx, gy, big] of [[98, 188, 1.4], [418, 140, 1], [516, 214, 0.6], [175, 520, 0.9], [270, 600, 0.7], [360, 300, 0.7]]) {
    GLINTS.push([gx, gy, big], [2 * HX - gx, gy, big]);
  }
  GLINTS.push([540, 965, 0.8]);
  const uFI = gl.getUniformLocation(prog, 'uFI');
  function drawFrame(t, yaw, pitch) {
    gl.uniform1f(gl.getUniformLocation(prog, 'uTailY'), eyc - (978 - HY) / sImg);
    gl.uniform1f(gl.getUniformLocation(prog, 'uCy'), cyOff);
    gl.uniform3f(uFI, HX / IMG, (HY + eyc * sImg) / IMG, sdfReady ? sImg / IMG : 0);
    GLINTS.forEach(([gx, gy, big], i) => {
      const [x, y, k] = toScreen((gx - HX) / sImg, eyc - (gy - HY) / sImg, 0, yaw, pitch);
      const tw = Math.pow(Math.max(0, Math.sin(t * (0.55 + (i % 4) * 0.2) + i * 1.7)), 8);
      star(x, y, 26 * big * fScale * k / K0, 0.06 + tw * 0.5, i % 3 ? 'rgba(160,190,255,0.85)' : 'rgba(140,175,255,0.85)');
    });
  }
  let quality = 1, slow = 0, fast = 0;
  function resize() {
    W = innerWidth; H = innerHeight;
    scale = Math.min(1.5, Math.max(1.0, (devicePixelRatio || 1))) * quality;
    cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
    const d2 = Math.min(devicePixelRatio || 1, 2);
    fx.width = W * d2; fx.height = H * d2;
    c2.setTransform(d2, 0, 0, d2, 0, 0);
    gl.viewport(0, 0, cv.width, cv.height);
    layout();
  }
  addEventListener('resize', resize);
  resize();

  let spin = 0, yawDrag = 0, vYaw = 0, down = false, lx = 0, ly = 0, dragPitch = 0, lastT = 0;
  cv.addEventListener('pointerdown', e => { down = true; lx = e.clientX; ly = e.clientY; document.body.classList.add('drag'); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    yawDrag += dx * 0.009; vYaw = dx * 0.3;
    dragPitch = Math.max(-0.5, Math.min(0.5, dragPitch + dy * 0.005));
    lx = e.clientX; ly = e.clientY;
  });
  const up = () => { down = false; document.body.classList.remove('drag'); };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

  const rot = (u, v, a) => { const c = Math.cos(a), s = Math.sin(a); return [c * u - s * v, s * u + c * v]; };
  function toScreen(x, y, z, yaw, pitch) {
    [y, z] = rot(y, z, pitch);
    [x, z] = rot(x, z, yaw);
    const k = 1.9 / (5.2 - z);
    return [W / 2 + x * k * Ncss, H / 2 - (y * k - cyOff) * Ncss, k];
  }
  function star(x, y, size, a, hue) {
    if (a <= 0.01) return;
    c2.globalAlpha = a;
    const g = c2.createRadialGradient(x, y, 0, x, y, size);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.18, hue);
    g.addColorStop(1, 'rgba(80,110,255,0)');
    c2.fillStyle = g;
    c2.beginPath(); c2.arc(x, y, size, 0, 6.283); c2.fill();
    const L = size * 3.4;
    for (const [dx, dy] of [[1, 0], [0, 1]]) {
      const lg = c2.createLinearGradient(x - dx * L, y - dy * L, x + dx * L, y + dy * L);
      lg.addColorStop(0, 'rgba(160,180,255,0)');
      lg.addColorStop(0.5, 'rgba(245,248,255,0.95)');
      lg.addColorStop(1, 'rgba(160,180,255,0)');
      c2.fillStyle = lg;
      const w = Math.max(1, size * 0.08);
      if (dx) c2.fillRect(x - L, y - w / 2, L * 2, w); else c2.fillRect(x - w / 2, y - L, w, L * 2);
    }
    c2.globalAlpha = 1;
  }

  function frame(ms) {
    const t = ms / 1000;
    const rawDt = t - lastT;
    const dt = Math.min(0.05, rawDt || 0.016); lastT = t;
    if (rawDt > 0.034) { slow++; fast = 0; } else if (rawDt < 0.018) { fast++; slow = 0; }
    if (slow > 12 && quality > 0.6) { quality *= 0.88; slow = 0; resize(); }
    if (fast > 180 && quality < 1) { quality = Math.min(1, quality * 1.1); fast = 0; resize(); }
    if (!down) { yawDrag += vYaw * dt; vYaw *= Math.pow(0.15, dt); dragPitch *= Math.pow(0.4, dt); }
    spin += (reduce ? 0.05 : 0.32) * dt;
    const yaw = spin + yawDrag;
    const pitch = Math.max(-0.5, Math.min(0.5, (reduce ? 0 : Math.sin(t * 0.27) * 0.08) + dragPitch));

    gl.uniform2f(uRes, cv.width, cv.height);
    gl.uniform1f(uT, reduce ? t * 0.2 : t);
    gl.uniform1f(uYaw, yaw);
    gl.uniform1f(uPitch, pitch);
    px += (tpx - px) * Math.min(1, dt * 3); py += (tpy - py) * Math.min(1, dt * 3);
    const la = reduce ? 0 : t * 0.45;
    const kx = 0.15 + 0.45 * Math.sin(la) + px * 0.7, ky = 0.9 - py * 0.5, kz = 0.35 + 0.25 * Math.cos(la);
    const kl = Math.hypot(kx, ky, kz);
    gl.uniform3f(uKey, kx / kl, ky / kl, kz / kl);
    gl.uniform1f(uSweep, reduce ? 2.4 : t * 0.7);
    gl.uniform1f(uN, Ncss * scale);
    c2.clearRect(0, 0, W, H);
    drawFrame(t, yaw, pitch);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
